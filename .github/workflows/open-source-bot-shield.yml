# =============================================================================
# Open-Source Maintainer Bot-Shield v2.1 (Split-Horizon CI-Salted SHA-256 Action)
# Provided free by WholeTrout Media (@WholeTroutMedia) to help open-source
# maintainers automatically close PRs from verified automated spam rings
# using one-way SHA-256 + CI-salted handle hashing (immune to bot-operator
# GitHub search AND local bot self-check enumeration) plus live cloud sync.
# Drop this file into `.github/workflows/open-source-bot-shield.yml` in any repo.
# =============================================================================
name: Open-Source Maintainer Bot-Shield

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  verify-author-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Author SHA-256 & Zero-Day Behavioral Signatures Against Live Outpost Shield
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          OUTPOST_PRIMARY_URL: "http://157.151.170.68:11449/v1/shield/intelligence.json"
          OUTPOST_FAILSAFE_URL: "http://129.80.87.93:11449/v1/shield/intelligence.json"
          SIGHTING_PRIMARY_URL: "http://157.151.170.68:11449/v1/shield/sighting"
          SIGHTING_FAILSAFE_URL: "http://129.80.87.93:11449/v1/shield/sighting"
          LIVE_FEED_URL: "https://raw.githubusercontent.com/WholeTroutMedia/open-source-bounties/main/registry/verified_spam_bot_blocklist.json"
          KNOWN_BOT_SHA256_HASHES: "ce574cdf31d76bf36221e24fee56faa6c0c7b255ce29bd1f16e10efe14f9e01f 089aa0077692d3c591647da5072b6b2a910aa64f804d1403516cee14ec466579 1fe4da54073757571b66ea81cdbc7ca8553115c04db6de2f2d8235c9fa867d8 fa078ed376a3490f76f8bba79db5f7d48d72613c98a1a593f36481a793539cc3 a814a68ce9c8551463f7c17dc1c8f849d09d1195b51364f80c011be64989b3a7 4e85a2070821e9a34349976db3a9e86b32f702b20ec584a373e5edb62aaa4951 01ef96bb84d5df28569fa0352afb91d01361e26d500ac89608465edfb69ad430 94ed782f0fb1fcb677f1c04f2d452000021cde5d80e19a646effdcbd13d036e9 c617c157e00416192d351c7cfbf965a9e168b4c77416e7f3200a7cb5aff01437 7d591e5ebdda7d59e6e530a6a2c82cbe314b4040703ea92062b14856484c3d07 b20615089dd7d3e7a54a706ece1a44432c6aed1ee34f81c83abf0bdeb9974f4b 6914fa61e92a1e50a374a5d3b9434267c7e38dc80b512785caa7f2ff97a759f0 60140b896b1a3908c66385ad5a069627491f2a21b760a70cb7b96d5e0d860452 363a6292261b30a71d1a32c1cf60e44aed824ce1e458a01ba19caf28b5c5b297 3dce8ef8ae125b9460f0a8a34efb288d0093416547ddf664b218ff8790d87187 f8cb1cb7faec3d60a8ec910337f6c91932e7d68dd06f59ce388f9a05f43f3701 74b74cf477d4768cfda73c9a8e8acdfeb1cae7acff5065b38afacbc3a3607e90 af08de3d18ca36cb879117b1ddd3618769d76f5aeafcd158328463d01207c3a9 504ca9382b16ecc80b7368e680393d927da644e2f81652e4d265d5e2b25e75e0 0c8c9683a5894b9dcf5185bafc5cc49698b75e8a117f074758025a6e734f7d1f 15f83cadc0c91f26e2d1739d6d35d1b8c28c8092fbb400354a59ce0142fab9a9 b5c3e334f1ecd77f57a0f47c47bc4911a112a65c247ab6221f649c0c8847bb96 681cafa15e3ab5bd8b6c9ce9408d1ce9d1f0b421fd1d2f712b74a1bb6eece2cc c9a891b9b382ded88b133024c9a58a0f3f96ad2f76b93e7425eece64370ea97a 60c4619c1f3cbc62966cee1548a0e2f1cacd2b6c00c0a49f33405fb93c172c9b 31ecf3f99411631416129b9616ca0703e809d792054a4ac5e29f6d97a57b55ee 6c701073468c8e4cf97184ea7390d954fd19c84ef8fc44256911f67649b7fcbe fb1ce85ab43fdd7147c88d3af68c77711ca2f628fb7a190035b55cf6dab69bd4 aaad9df24820a78230009beb3a43ae930b4eee15c29a1ef31e5ed6181948f0da cfddf223d0894d95ca0aec0aaed5d8d8009936c25d6d9e09cd135be2d1c02d83 e1a85b60961e3d60e2c72f22aae74e2db1a7fb52e2efef03fb2de2bcaa8c7295 1d0d3b082bd34d42bf7ffa41ca2cb848151196f2940b40e5493377e55ef2e0ae bc6e65d8d75a4bf1cc8587ba7eae0e2845af63a686f607f404c92ae95d787a3b 2a941f06e40dabf643ba3a9b2562eb88cb3beaa25d1986c5e19741be6c33aedb f8e2686106fdee11a04386d0646d15cddaf596ae1e221fb6cc9dd29a7bb492cf"
        run: |
          AUTHOR_HASH=$(printf "%s" "${PR_AUTHOR,,}" | sha256sum | awk '{print $1}')
          SALTED_CI_HASH=$(printf "v2-ci-gate::%s" "${PR_AUTHOR,,}" | sha256sum | awk '{print $1}')
          OUTPOST_HASHES=$(curl -fsSL --max-time 3 "$OUTPOST_PRIMARY_URL" 2>/dev/null || curl -fsSL --max-time 3 "$OUTPOST_FAILSAFE_URL" 2>/dev/null || true)
          OUTPOST_PARSED=$(printf "%s" "$OUTPOST_HASHES" | grep -oE '[0-9a-f]{64}' | tr '\n' ' ' || true)
          LIVE_HASHES=$(curl -fsSL --max-time 4 "$LIVE_FEED_URL" 2>/dev/null | grep -oE '[0-9a-f]{64}' | tr '\n' ' ' || true)
          ALL_HASHES="$KNOWN_BOT_SHA256_HASHES $OUTPOST_PARSED $LIVE_HASHES"
          MATCH_REASON=""
          for expected_hash in $ALL_HASHES; do
            if [ "$AUTHOR_HASH" = "$expected_hash" ] || [ "$SALTED_CI_HASH" = "$expected_hash" ]; then
              MATCH_REASON="SHA256_BLOCKLIST_MATCH"
              break
            fi
          done
          if [ -z "$MATCH_REASON" ]; then
            COMBINED_TEXT=$(printf "%s %s" "$PR_TITLE" "$PR_BODY" | tr '[:upper:]' '[:lower:]')
            if printf "%s" "$COMBINED_TEXT" | grep -qE "autonomous documentation / schema resolution by hermes agent|strictly verified with local test suites in an isolated runner|bounty task in bounty-plaza|0x944664b9d45fef8c9bdbb084ce59e6f6ee724861|0xf96cc784ca79c300c274cd37853c6bb9caf9e46e"; then
              MATCH_REASON="ZERO_DAY_BEHAVIORAL_SYNDICATE_SIGNATURE"
            fi
          fi
          if [ -n "$MATCH_REASON" ]; then
            echo "Matched spam-ring signature ($MATCH_REASON): sha256:$AUTHOR_HASH"
            SIGHTING_JSON=$(printf '{"author_sha256":"%s","salted_ci_hash":"%s","repo":"%s","pr_number":%s,"reason":"%s"}' "$AUTHOR_HASH" "$SALTED_CI_HASH" "$REPO" "$PR_NUMBER" "$MATCH_REASON")
            curl -fsSL -X POST -H "Content-Type: application/json" -d "$SIGHTING_JSON" --max-time 3 "$SIGHTING_PRIMARY_URL" >/dev/null 2>&1 || curl -fsSL -X POST -H "Content-Type: application/json" -d "$SIGHTING_JSON" --max-time 3 "$SIGHTING_FAILSAFE_URL" >/dev/null 2>&1 || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Automated Bot-Shield Notice: Author signature (`sha256:$AUTHOR_HASH` · `$MATCH_REASON`) matched the public Open-Source Bot Abuse Evidence Ledger (`WholeTroutMedia/open-source-bounties/registry/verified_spam_bot_blocklist.json`). Closing automatically."
            gh pr close "$PR_NUMBER" --repo "$REPO"
            exit 0
          fi
